group=cn.song.mybatisplus.visualizer
# 版本号 = 发布日期（YYYY.M.D，一日一版，详见 docs/发行说明/版本号规范-说明文档.md）；内测通道追加 -beta.N 后缀，转正时去掉
version=2026.10.31-beta.1
# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# T-GifRecordSwitch：演示 GIF 录制环境开关，默认关闭（243 常规开发态）。
# 录制时 ./gradlew runIde -PgifRecord=true 切到 2026.2.1 沙盒 + JCEF 独立模块 +
# jvmToolchain(24) + 独立沙盒 MPSV-GifFresh。开关必须整体切换，详见 build.gradle.kts 顶部注释。
# 录制态下 test 源码编译不过，故 buildPlugin/publishPlugin 会拒绝该开关。
# gifRecord=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
# T-TestPerf-01（2026-09-14）关闭：build cache 三次实证复用陈旧 compileTestKotlin 产物造成
# 成片 NoSuchMethodError 假失败（最近一次 2026-09-13 合并后全量 503 失败），只能
# `rm -rf build` + 重跑整轮回收——真实耗时远超缓存收益（增量编译不受影响，仅失去
# 「跨构建复用历史产物」）。此前各文档「--no-build-cache 惯例」随之作废，普通命令无需再带。
# T-TestPerf2（2026-09-15）补记：本行在本机曾长期空转——用户级 ~/.gradle/gradle.properties
# 的 org.gradle.caching=true 按 Gradle 属性优先级（GRADLE_USER_HOME > 项目根）覆盖上行；
# 关闭现改落 settings.gradle.kts 的 buildCache.local（settings 配置优先级高于属性文件）。
# 【2026-09-23 T-BuildConcurrency 订正】下行 jvmargs 曾被用户级 -Xmx2g/256m 覆盖从未生效，
# 现用户级已与本行统一为 -Xmx4096m/1536m，daemon 参数在全工作树一致（覆盖冲突已消除）。
org.gradle.caching=false
# 并行分片测试（2026-08-15 开启任务并行；2026-09-14 T-TestPerf-04 分片自动分区；
# 2026-09-15 T-TestPerf2 分片时长均衡 + 一命令并行）：./gradlew testShards 一命令，
# 各片（独立沙盒）借本开关并发执行，片数 -PtestShardCount=N（默认 5，T-TestPerf7 定案）——详见 T-TestPerf2 计划
org.gradle.parallel=true

# 测试 JVM 堆临时覆盖开关（T-TestPerf2，对所有 Test 任务生效；Gradle Test 默认 512m）：
# ./gradlew testShards -PtestHeapSize=2g。缺省不设维持默认，转正与否看实测收益
# testHeapSize=2g

# T-TestPerf5（2026-09-25）：测试 JVM GC 对照实验销账——SerialGC 筛查窗曾读出 -6.4%
# （177s/173s vs G1 基线 194s/180s），但跨窗复检失败（晚窗 serial 193s/188s vs 同刻 G1 对照
# 187s/190s，execSum 两配置同步 +5%）——机器窗口漂移 ±5~8% 与效应同量级，净效应 ≈0 不落默认。
# 开关保留（-PtestGc=serial / -PtestGc=parallel），负载形态再变时按「同窗交错 A/B」法复测，
# 禁单窗成对对照直接定案（本轮教训，详版 docs/经验总结/20260925-0335-全量测试墙钟三次压缩-经验总结.md）。
# testGc=serial

# T-TestPerf9（2026-09-29）：JVM 线程面二代旋钮（只压 JVM 自带线程、不动应用并发度，与上节 T5 一代
# ActiveProcessorCount 机制不同；实现在 mpv-testing.gradle.kts withType<Test> 块）。四旋钮筛查轮同窗
# 交错实测全部无赢家，缺省全不动、开关保留供负载形态变化后复测：
#   testGcThreads=2        → -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1（−2.5%，未过 5% 判据）
#   testCiCount=3          → -XX:CICompilerCount=3（+11% 反向——JIT 线程压帽无益有损）
#   testNoExplicitGc=true  → 禁用勿再试：-XX:+DisableExplicitGC 使 System.gc() 空操作，而
#                             ConflictProbeProjectRetentionTest（弱键集回收断言）依赖真 GC——
#                             运行时 flag 也可能改变测试语义，启用前须逐类审计 GC 依赖
#   testTieredStop=true    → -XX:TieredStopAtLevel=1（−2.4% 未过判据，T8 S5 遗留销案）
# 片数定例（保质期第五次触发，同日）：维持 5 片——6 片两窗 −1.2%/+8% 不同向、execSum +17~26% 膨胀、
# Commit 峰值 69.67GB 余量仅 5.0GB 跌破 8GB 硬判据（T7/T8/T9 连续第三次否决）；4 片 193s 仍劣。
# 段级拆账（T9 S1，--profile+任务时间戳+XML exec 三源）：墙钟 97% 在分片窗口；开销带 ~4s
# （启动+配置 ~2s、jar 1.1s、prepareSandbox×5 并行 ~0.1s）；平台 bootstrap ≈13s/JVM（并行不叠加）；
# 常规单文件增改编译带 6~8s（2.5min 编译税仅 buildSrc 触碰/clean/新树全量三种一次性场景）——
# 构建侧可压缩空间已到地板，墙钟地板 ≈2.5min @ 6093 例（本机 6C12T/32GB），剩余变量在测试执行语义内部。

# Proxy configuration (adjust port to match your proxy client, e.g. Clash default is 7890)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890

# M17：本地 Ultimate 平台类加载量大，提高 Gradle daemon 元空间与堆内存
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m

# Kotlin 编译 in-process（T-BuildConcurrency 2026-09-23 常驻，取代临时 -P 传参）：
# 编译在 Gradle daemon 进程内完成，不再拉起共享 KotlinCompileDaemon——多工作树并行时
# 同参数 Kotlin daemon 只有一个且同时只服务一个编译请求，是多路编译串行排队（实测两路
# 分别卡 70/20 分钟）的机制根源。内存代价由上面的 daemon 1536m 元空间承接（P-3 实测
# 无 OOM，见 T-BuildConcurrency 计划 §实施记录）。若在编译密集任务回现 Metaspace OOM：
# 回退方式是删除本行恢复独立 Kotlin daemon；若仍想避免共享串行，按该计划 §九 D2 改用
# kotlin.daemon.jvm.options 给每路不同的 daemon JVM 参数强制隔离。
kotlin.compiler.execution.strategy=in-process
