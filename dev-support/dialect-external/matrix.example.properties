# 真机方言验证矩阵（外部实例）——模板，不含任何凭据
#
# 用法：
#   1) 复制本文件到 .local/dialect-external-matrix.properties（.local 整目录 gitignore，可放明文凭据）
#      cp dev-support/dialect-external/matrix.example.properties .local/dialect-external-matrix.properties
#   2) 按 .local/test-databases.md 的实例清单填连接串
#   3) ./gradlew dialectExternalVerify
#      或 ./gradlew dialectExternalVerify -PdialectExternalMatrix=<绝对路径>
#
# 读数是「插件渲染的 SQL 在真引擎上真执行」+「全量保留字逐个当标识符建表/查询」，
# 结果写到 build/reports/dialectExternalVerify/summary.md
# （汇总行：通过 / 跳过 / 超时 / 失败 四栏，逐桶各列明细），失败或超时即任务红。
# 发版时把该摘要的结论登记进发行说明。
#
# 字段（每条实例一组，<key> 自拟且唯一）：
#   <key>.dialect        必填。必须与插件设置页的方言名**逐字一致**：
#                        MySQL / PostgreSQL / Oracle / SQL Server / MariaDB /
#                        DM（达梦） / KingBase（人大金仓） / OceanBase / openGauss /
#                        GaussDB / HighGo / Vastbase
#                        写错会静默回退 MySQL——测试会逐字核对并直接判红。
#   <key>.url            必填，JDBC URL（驱动已在测试 classpath 上，无需另配）。
#   <key>.user           可选，无认证库留空。
#   <key>.password       可选。
#   <key>.timeoutSeconds 可选，**该实例的实例级预算**（秒）。实例在预算内没有进展（典型形态：挂在驱动
#                        socket 读里，既不抛也不返回，登录超时 20s 管不到）即判 TIMEOUT 并继续跑下一个
#                        实例，整轮不再被单个坏实例拖死。超时既不计通过也不静默跳过——summary 单列
#                        「超时」桶并按桶列明细，任务判红。取值优先级：本字段 → 系统属性
#                        `-Dmpvs.external.instanceTimeout`（秒）→ 默认 300s。**不要**为了抹掉超时去调大
#                        预算（掩盖）或给实例标 optional（等于把「没验」写成「跳过」）。
#   <key>.optional       true 时连不上只记 SKIP 不判红；**也**是该实例超时的唯一降级通道（summary 里写作
#                        `SKIP(超时)`）。**只用于厂商锁定 / 权限受限实例**
#                        （例如官方 openGauss 5.0.0 的 public schema 无 CREATE 权限），
#                        正常实例不要标，否则等于把「没验」写成「通过」。
#   <key>.multiRowValues 默认 true；指向 12c 之前的 Oracle 填 false。
#   <key>.skipWords     可选，逗号分隔。**只用于「内核把该词当系统列/伪列」这类语义冲突**，
#                       例如磐维 A 内核把 rowid 做成系统列（attnum<0），引号包裹仍报
#                       `column name "rowid" conflicts with a system column name`；真 Oracle
#                       上同一句可建表，故不能从产品保留字表里剔除，只能按实例声明例外。
#                       **不要**用它掩盖渲染缺陷：渲染产出在真引擎跑不通，该红就红。
#   <key>.skipReason    skipWords 非空时**必填**（否则直接判红）：写清内核行为与证据，
#                       报告会把它当例外台账。skipWords 里的词不在该方言词表中同样判红（防拼写错误）。
#
# 实例清单与凭据：.local/test-databases.md（勿把凭据抄进 docs/ 或 src/）。
# DBX 通道只做临时探测，不作为门禁读数来源（2026-10-31 定例）。

instances = mysql, postgres

mysql.dialect = MySQL
mysql.url = jdbc:mysql://127.0.0.1:3306/mpvs_gate
mysql.user = gate
mysql.password = change-me

postgres.dialect = PostgreSQL
postgres.url = jdbc:postgresql://127.0.0.1:5432/mpvs_gate
postgres.user = gate
postgres.password = change-me
