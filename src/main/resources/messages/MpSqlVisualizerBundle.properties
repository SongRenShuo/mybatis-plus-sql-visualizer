panel.explain.history.baseline=Compare with baseline (no SQL execution)
panel.explain.history.previousSession=Previous execution (current session)
panel.explain.history.snapshot=Saved plan {0} (local time) · #{1}
panel.explain.history.notComparable=This baseline cannot be compared in the current format.
panel.explain.history.SAVED=Plan retained in SQL history (up to 5 per entry).
panel.explain.history.SESSION_ONLY=Session only: no stable target UUID or matching project history entry.
panel.explain.history.TOO_LARGE=Plan was not saved: serialized snapshot exceeds 256 KiB. The displayed result was not shortened.
panel.explain.history.CLEARED_OR_REMOVED=History was cleared or the original entry removed; this late result was not saved.
