settings.sourceFrameSkipPrefixes=Source capture frame skip prefixes (one per line):
settings.sourceFrameSkipPrefixes.tip=Package prefixes of in-house frameworks (e.g. com.corp.engine.). Registered prefixes are skipped when locating the source position, so jumps land on real business call sites. Takes effect immediately after apply (hot push, no application restart needed).
