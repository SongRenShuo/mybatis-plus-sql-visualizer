[versions]
junit = "4.13.2"
mp = "3.5.17"
# 迁移期允许：data class 可变/含方法场景可用 Lombok @Data/@Value 减少样板（Kotlin→Java 全量改写）
lombok = "1.18.34"
# P-立项-05：方言真实验证（嵌入式数据库，仅测试 classpath，插件运行时零依赖不变）
h2 = "2.3.232"
sqlite-jdbc = "3.50.3.0"
# P-立项-05 Phase 2：Docker 真实环境验证（本机无 Docker 时测试自动跳过，详见
# DialectDockerVerificationTest；版本取自开发计划 20260828-2000）
testcontainers = "1.19.3"
mysql-connector = "8.0.33"
postgresql = "42.7.1"
mssql-jdbc = "12.4.2.jre11"
mariadb-java-client = "3.3.3"
ojdbc11 = "23.3.0.23.09"
# T-XcDialects3：信创三族驱动（外部实例验证 DialectDockerVerificationTest 用，仅测试
# classpath——插件运行时零依赖不变；坐标均在 Maven Central，agent 子项目同款）
highgo-jdbc = "6.2.5"
vastbase-jdbc = "2.16.1v"
kingbase-jdbc = "9.0.1"
# T-DialectDriverGap（2026-10-30）：补齐外部实例验证缺的三族驱动——达梦 / openGauss / OceanBase。
# openGauss 必须取 `-og` 变体：无后缀的 opengauss-jdbc 是 pgjdbc 改名包（含 org/postgresql/*），
# 会在测试 classpath 上遮蔽真 PG 驱动；`-og` 才是 org.opengauss.Driver（实测两 jar 的
# org/postgresql 条目数：-og = 0，无后缀 > 0）。三件均仅测试 classpath，插件运行时零依赖不变。
dameng-jdbc = "8.1.3.140"
opengauss-jdbc = "6.0.0-og"
oceanbase-client = "2.4.19"
# T-DialectLabMatrix：方言 Lab 配方一致性守卫的 YAML 解析（仅测试 classpath）
snakeyaml = "2.2"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
# 迁移期允许：Lombok（仅编译期注解处理器，运行时零依赖；插件产物由 annotationProcessor 展开方法）
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
# P-立项-05：H2 嵌入式验证（REGULAR 模式验证 H2 方言；MODE=MySQL/MariaDB/PostgreSQL/Oracle/
# MSSQLServer 兼容模式验证对应方言的 SQL 语法形态——无 Docker 环境下的最强本机证据）
h2 = { module = "com.h2database:h2", version.ref = "h2" }
# P-立项-05：SQLite 真实引擎验证（sqlite-jdbc 内嵌原生 SQLite，100% 真实语法证据）
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
# P-立项-05 Phase 2：Docker 容器验证（真实 MySQL/PG/MariaDB/SQL Server/Oracle 引擎）
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:mariadb", version.ref = "testcontainers" }
testcontainers-mssqlserver = { module = "org.testcontainers:mssqlserver", version.ref = "testcontainers" }
testcontainers-oracle-xe = { module = "org.testcontainers:oracle-xe", version.ref = "testcontainers" }
mysql-connector = { module = "mysql:mysql-connector-java", version.ref = "mysql-connector" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql-jdbc" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-java-client" }
ojdbc11 = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "ojdbc11" }
highgo-jdbc = { module = "com.highgo:HgdbJdbc", version.ref = "highgo-jdbc" }
vastbase-jdbc = { module = "cn.com.vastdata:vastbase-jdbc", version.ref = "vastbase-jdbc" }
kingbase-jdbc = { module = "cn.com.kingbase:kingbase8", version.ref = "kingbase-jdbc" }
dameng-jdbc = { module = "com.dameng:DmJdbcDriver18", version.ref = "dameng-jdbc" }
opengauss-jdbc = { module = "org.opengauss:opengauss-jdbc", version.ref = "opengauss-jdbc" }
oceanbase-client = { module = "com.oceanbase:oceanbase-client", version.ref = "oceanbase-client" }
# T-DialectLabMatrix：DockerComposeLabConsistencyTest 解析 docker-compose-dialects.yml（钉版本/
# 端口/必填 env/healthcheck 四硬约束 + database-lab 文档一致性），不起 Docker 即可校验配方
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
# T-M23.13：真实 MP jar 进测试 classpath（Heavy 语义黄金用例的方法签名/注解元数据来源；
# 与官方 API 覆盖矩阵基准一致；仅测试依赖，插件运行时零依赖不变）。
# 注：MPJ 1.5.x 不在 Maven Central（实证 1.5.7~1.5.9 均 404，Central 最新 1.4.13），
# 锚点/定位黄金用例所需签名（and(Consumer)/注解类）均由 mp-core 提供，暂不加 MPJ。
mp-core = { module = "com.baomidou:mybatis-plus-core", version.ref = "mp" }
