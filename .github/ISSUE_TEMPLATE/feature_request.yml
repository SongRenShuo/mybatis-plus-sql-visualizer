name: 功能建议
description: 新能力、交互改进或能力对齐建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > **先看这里**：功能建议请优先提交到[官网需求池](https://sql-visualizer.jvtools.cn/about/feedback)——
        > 那里有统一的排期视图。这里适合已经有明确实现思路、愿意一起讨论技术方案的建议。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你遇到什么问题？现有能力为什么不够？尽量给一个真实例子。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你希望插件怎么做；如果有交互或 SQL 输出示例，贴出来。
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: 方案建议（可选）
      description: 你了解到的实现思路、参考插件或 API。

  - type: textarea
    id: impact
    attributes:
      label: 影响面
      value: |
        - 是否涉及 UI / 设置页：
        - 是否涉及数据库执行或安全护栏：
        - 是否涉及平台兼容（243 / 253 / 262）：

  - type: textarea
    id: workaround
    attributes:
      label: 替代方案（可选）
      description: 现在你用什么办法绕开这个问题？
