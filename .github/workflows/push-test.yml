# 推送测试（自动触发）——与手动门禁 workflow（build-plugin.yml）分开的独立文件。
#
# 为什么单独一个文件：
#   ① build-plugin.yml 的每个 job 都用 `if: inputs.mode == ...` 判模式，而 push 事件没有 inputs
#      （空串会让所有 if 变假，整轮只剩 test 跑、gate 必红）。要合进同一个文件就得给每个 if
#      加 event_name 分流，改动面大且容易出错。
#   ② 手动门禁（gate / release / publish）的语义与并发纪律保持不变，发行链零风险。
#
# 定位：**推送即跑全量测试**（5 片平台类 + 1 条纯逻辑快桶腿，不含兼容验证三条腿）。
# 读数依据（2026-11-05 实测）：5 片各自独立编译，最慢片 8.2~11.0 分钟，5 个 job、约 50 runner 分钟。
# T-JUnit5Eval 方案 2（2026-11-05）后分片只装平台类（446 类 / 4202 例），零 com.intellij 引用的
# 374 类 / 4393 例由第 6 条 job（testFast）承载——两条腿覆盖的类互不重叠，合起来仍是全量。
# 对比过的另一条路——单 job 跑「编译 + testFast 纯逻辑桶」：墙钟 10.7 分钟（缓存 2.6 + 编译 3 +
# 4382 个用例 4.5），只覆盖一半测试。**同样的墙钟，5 片给的是全量**，故取 5 片 + 快桶腿。
#
# 与手动门禁的分工：
#   - 推送 → 本 workflow 跑全量测试，约 11 分钟出结论；
#   - 发版前 → build-plugin.yml 手动 gate，跑 build + verify×3 + marketplace×3 + verifyplugin
#     + 全量测试（测试部分与推送那轮同口径，可用 RC-P1c 的「零代码改动复用」判据省掉）。
#
# 高频推送友好：并发组按分支、cancel-in-progress: true——新推送直接取消同分支在跑的整轮，
# 队列永远只留最新提交，延迟固定；连推 5 次也只按最后那一次计成本。
#
# 缓存只读：写权限留给手动门禁的 build job（多 job 并发写同一 key 会全部保存失败）。
name: 推送测试（自动）
run-name: 推送测试 · ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches: [master]

concurrency:
  group: plugin-ci-push-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  # T-CiNightlyNudge（2026-11-06）：夜间轮的兜底派发要调 Actions API
  actions: write

jobs:
  # T-CiNightlyNudge（2026-11-06 实测背景）：GitHub 的 `schedule` 是 best-effort——
  # 2026-11-05 的 `0 18 * * *`（北京 02:00）到 20:14Z 仍未触发，晚了 2 小时 14 分，
  # 期间 githubstatus 全绿、default_branch=master、workflow state=active、仓库无归档，
  # 历史上 9 轮夜间全是 workflow_dispatch（cron 从上线起一次没跑过）。
  # 结论：不能把「每晚自动」押在 GitHub 定时器上。这里加一道自愈：**当天还没有夜间轮就派发一次**。
  # 判据与夜间自身的 changes 闸门同源——夜间只在「前 24 小时有代码提交」时真跑，而这条 job 只在
  # push 到 master 时执行，所以「有 push 的那天」正好是夜间该跑的那天。
  # 幂等：先查当天是否已有 nightly 轮（任何 event），有就跳过，避免和迟到的 schedule 撞成两轮。
  nightly-nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 当天没有夜间轮就派发一次
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 兜底动作本身不该把推送轮打红：查询失败按「未知」处理并跳过派发
          set -uo pipefail
          today=$(date -u +%Y-%m-%d)
          count=$(gh run list --repo "$REPO" --workflow nightly-full.yml --limit 50 \
            --json createdAt --jq "[.[] | select(.createdAt | startswith(\"$today\"))] | length" 2>/dev/null || echo "")
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo '::warning::查询当天夜间轮失败（gh 调用异常），本轮跳过兜底派发'
            exit 0
          fi
          echo "今天（$today UTC）已有夜间轮 $count 个"
          if [ "$count" -gt 0 ]; then
            echo '::notice::今天已有夜间轮，跳过兜底派发'
            exit 0
          fi
          # 容错：workflow 文件若尚未出现在默认分支，派发会 404——降级成 notice，不把推送轮打红
          if gh workflow run nightly-full.yml --repo "$REPO" 2>/dev/null; then
            echo '::notice::已兜底派发夜间全量'
          else
            echo '::warning::兜底派发失败（workflow 不在默认分支或 API 拒绝），夜间仍依赖 schedule'
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        # T-CiShard6 A/B 结论（2026-11-05 晚 run#23 实测）：**6 片不合算，退回 5 片**。
        # 6 片的分片步骤 455~492s，5 片基线 433~495s——没有变化；而每条腿都要重新编译
        # （约 2.4 分钟固定成本）与恢复缓存（89~219s），多一条腿只多烧 runner 时间不小墙钟。
        # 墙钟上 test(5) 反而 11.8 分钟（5 片基线 10.2~10.5）。结论与 T-TestPerf5 当年 6 片回劣同向。
        # 想再试先读 dev-support/test-shard-weights.tsv 的实际分布，别按「除以片数」推。
        shard: ['1', '2', '3', '4', '5']
    runs-on: windows-latest
    timeout-minutes: 40

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出目标分支
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 CI 下载环境
        # 仅修改 Runner 中的副本，移除本地代理并使用 Gradle 官方下载源（与手动门禁同口径）
        run: |
          $propertiesPath = 'gradle.properties'
          $properties = Get-Content -LiteralPath $propertiesPath
          $properties | Where-Object { $_ -notmatch '^systemProp\.(http|https)\.proxy(Host|Port)=' } |
            Set-Content -LiteralPath $propertiesPath -Encoding utf8

          $wrapperPath = 'gradle/wrapper/gradle-wrapper.properties'
          $wrapper = Get-Content -LiteralPath $wrapperPath -Raw
          $wrapper.Replace('mirrors.cloud.tencent.com/gradle/', 'services.gradle.org/distributions/') |
            Set-Content -LiteralPath $wrapperPath -Encoding utf8 -NoNewline

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: 准备测试 demo
        # Demo* 普查用例硬断言 demo 源码存在（clone 到仓库兄弟目录的固定位置）
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File dev-support/test-demo/setup-test-env.ps1 -SkipDb

      - name: 分片 ${{ matrix.shard }}
        # 与手动门禁同口径剔除三类真机依赖用例（本机 MySQL / 本机 JDK8 / agent 池）；
        # 走 run-gradle-retry：同一处 Gradle zip 文件系统竞态也会打在配置期。
        timeout-minutes: 30
        run: >-
          pwsh -NoProfile -File dev-support/ci/run-gradle-retry.ps1 -GradleArgs
          ":testShard${{ matrix.shard }} -PgifRecord=false --console=plain
          -PtestShardExcludeClasses=cn.song.mybatisplus.visualizer.execute.DataSourceJdbcSmokeTest,cn.song.mybatisplus.visualizer.log.O147RealAgentAcceptanceTest
          -PagentTestExclude=cn.song.mybatisplus.sqlvis.agent.AttachPoolWarmGateTest"

      - name: 失败诊断输出（断言消息打到任务日志）
        # Gradle 精简控制台不显示断言消息（expected/actual），失败时把它们直接打进任务日志。
        if: failure()
        run: |
          $files = Get-ChildItem -Path build/test-results, sub-projects/sql-visualizer-agent/build/test-results -Recurse -Filter 'TEST-*.xml' -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $content = Get-Content -LiteralPath $f.FullName -Raw -Encoding UTF8
            $failMatches = [regex]::Matches($content, '<(?:failure|error) message="([^"]*)"', 'Singleline')
            if ($failMatches.Count -gt 0) {
              Write-Host "===== $($f.Name) ====="
              foreach ($m in $failMatches) {
                Write-Host ([System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value))
                Write-Host '-----'
              }
            }
          }

  # T-JUnit5Eval 方案 2（2026-11-05）：纯逻辑快桶腿。分片只装平台类（源码引用 com.intellij 的），
  # 零平台引用的 374 类 / 4393 例改由 testFast 在自己的 JVM 里跑——它不进分片 matrix 的任何一片，
  # 漏了这条 job 就是「4000+ 例在 CI 上没人跑」且总数看起来只少一点。
  # 与分片同口径：同样准备 demo、同样 run-gradle-retry 包装、同样失败诊断输出；
  # -PtestShardExcludeClasses 照传——testFast 与分片同源尊重该清单（被排除的纯逻辑类不能从这条腿溜回来）。
  # T-CiFastSplit（2026-11-05 晚）：再拆两片。run#21/#22 实测这条腿 601s 是整轮关键路径（分片
  # 433~495s），拆开后每片约 300s，墙钟回到由分片决定。切分按入库权重画像做 LPT 装箱
  # （buildSrc 的 fastBucketSliceCount/fastBucketSlice），两片并集=整桶，配置期 require 兜底。
  fast:
    strategy:
      fail-fast: false
      matrix:
        slice: ['1', '2']
    runs-on: windows-latest
    timeout-minutes: 40

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出目标分支
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 CI 下载环境
        run: |
          $propertiesPath = 'gradle.properties'
          $properties = Get-Content -LiteralPath $propertiesPath
          $properties | Where-Object { $_ -notmatch '^systemProp\.(http|https)\.proxy(Host|Port)=' } |
            Set-Content -LiteralPath $propertiesPath -Encoding utf8

          $wrapperPath = 'gradle/wrapper/gradle-wrapper.properties'
          $wrapper = Get-Content -LiteralPath $wrapperPath -Raw
          $wrapper.Replace('mirrors.cloud.tencent.com/gradle/', 'services.gradle.org/distributions/') |
            Set-Content -LiteralPath $wrapperPath -Encoding utf8 -NoNewline

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: 准备测试 demo
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File dev-support/test-demo/setup-test-env.ps1 -SkipDb

      - name: 纯逻辑快桶 ${{ matrix.slice }}/2
        timeout-minutes: 30
        run: >-
          pwsh -NoProfile -File dev-support/ci/run-gradle-retry.ps1 -GradleArgs
          ":testFast -PgifRecord=false --console=plain
          -PfastBucketSliceCount=2 -PfastBucketSlice=${{ matrix.slice }}
          -PtestShardExcludeClasses=cn.song.mybatisplus.visualizer.execute.DataSourceJdbcSmokeTest,cn.song.mybatisplus.visualizer.log.O147RealAgentAcceptanceTest"

      - name: 失败诊断输出（断言消息打到任务日志）
        if: failure()
        run: |
          $files = Get-ChildItem -Path build/test-results -Recurse -Filter 'TEST-*.xml' -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $content = Get-Content -LiteralPath $f.FullName -Raw -Encoding UTF8
            $failMatches = [regex]::Matches($content, '<(?:failure|error) message="([^"]*)"', 'Singleline')
            if ($failMatches.Count -gt 0) {
              Write-Host "===== $($f.Name) ====="
              foreach ($m in $failMatches) {
                Write-Host ([System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value))
                Write-Host '-----'
              }
            }
          }
