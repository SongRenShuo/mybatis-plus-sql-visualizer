name: 手动发行插件
run-name: 发行插件 · ${{ inputs.branch || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要发行的分支（留空使用上方选择的分支）'
        required: false
        type: string

# 创建 Release 并上传资产需要写权限（GITHUB_TOKEN）
permissions:
  contents: write

# 同一分支的发行流水线串行排队，避免两次运行并发覆盖同一 Release 资产
concurrency:
  group: release-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 240

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出目标分支
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 CI 下载环境
        run: |
          # 仅修改 Runner 中的副本，移除本地代理并使用 Gradle 官方下载源。
          $propertiesPath = 'gradle.properties'
          $properties = Get-Content -LiteralPath $propertiesPath
          $properties | Where-Object { $_ -notmatch '^systemProp\.(http|https)\.proxy(Host|Port)=' } |
            Set-Content -LiteralPath $propertiesPath -Encoding utf8

          $wrapperPath = 'gradle/wrapper/gradle-wrapper.properties'
          $wrapper = Get-Content -LiteralPath $wrapperPath -Raw
          $wrapper.Replace('mirrors.cloud.tencent.com/gradle/', 'services.gradle.org/distributions/') |
            Set-Content -LiteralPath $wrapperPath -Encoding utf8 -NoNewline

      - name: 配置 Gradle 缓存
        # 缓存 Gradle User Home：verifyPlugin 下载的三版本 IDE 发行版与 verifier-cli 跨轮复用
        uses: gradle/actions/setup-gradle@v5

      - name: 准备测试 demo
        # testShards 的 Demo* 普查用例硬断言 demo 源码存在（clone 到仓库兄弟目录的固定位置）；
        # -SkipDb：CI 无本机 MySQL，testDatabase / e2eFakeIde 属本地真库环节，不在本流水线内
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File dev-support/test-demo/setup-test-env.ps1 -SkipDb

      - name: 打包插件 + 官方兼容验证
        # 发版链前半（对应本地 releaseGate）：verifyPlugin 在线报告口径为「离线 + 豁免清单」，
        # 同时为后续 verifyGate/verifyMarketplace 预热 verifier-cli 与 253/262 发行版缓存
        #（二者直驱 CLI，要求 jar 与 IDE 目录已在 Gradle 缓存中）。
        run: ./gradlew.bat :buildPlugin :verifyPlugin -PgifRecord=false --no-daemon --console=plain

      - name: 权威兼容门禁（verifyGate，三目标 243/253/262）
        # -PverifyOnly=true：复用上一步的发行包，不重打包（Jar 带 MPV-Build 时间戳恒重跑）
        run: ./gradlew.bat :verifyGate -PverifyOnly=true -PgifRecord=false --no-daemon --console=plain

      - name: Marketplace 同口径门禁（verifyMarketplace，在线 + 无豁免）
        run: ./gradlew.bat :verifyMarketplace -PgifRecord=false --no-daemon --console=plain

      - name: 全量分片测试（testShards，真机类剔除）
        # 三类真机依赖用例在 CI 剔除（与 testDatabase / e2eFakeIde 同口径，本地发版前照跑）：
        #   AttachPoolWarmGateTest——child JVM 起 Hikari 真池直连本机 MySQL；
        #   DataSourceJdbcSmokeTest——demo 数据源 JDBC 直连 127.0.0.1:3306；
        #   O147RealAgentAcceptanceTest——需要本机 JDK8（sqlvis.jdk8home 默认硬编码本机路径）。
        # root 侧用既有 -PtestShardExcludeClasses 隔离口，agent 侧用 -PagentTestExclude（同语义）。
        run: >-
          ./gradlew.bat :testShards -PgifRecord=false --no-daemon --console=plain
          "-PtestShardExcludeClasses=cn.song.mybatisplus.visualizer.execute.DataSourceJdbcSmokeTest,cn.song.mybatisplus.visualizer.log.O147RealAgentAcceptanceTest"
          "-PagentTestExclude=cn.song.mybatisplus.sqlvis.agent.AttachPoolWarmGateTest"

      - name: 上传插件 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ github.run_number }}
          path: build/distributions/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.branch || github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ((Get-Content 'gradle.properties' | Where-Object { $_ -match '^version=' } | Select-Object -First 1) -replace '^version=', '').Trim()
          if (-not $version) { throw '未能从 gradle.properties 解析出 version=' }
          $zipPath = "build/distributions/mybatis-plus-sql-visualizer-$version.zip"
          if (-not (Test-Path -LiteralPath $zipPath)) { throw "发行包不存在：$zipPath" }

          # Release 标签 = 版本号（与 update/update.json 的 downloadUrl 标签约定一致）
          $tag = $version
          Write-Host "版本=$version 标签=$tag 分支=$env:RELEASE_BRANCH 提交=$env:RELEASE_SHA"

          $notesFile = New-TemporaryFile
          @(
            "本发行包由发行流水线构建：分支 $env:RELEASE_BRANCH @ $env:RELEASE_SHA。",
            "构建记录：$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            '',
            '## 变更说明',
            '',
            (Get-Content 'gradle/plugin-change-notes.html' -Raw)
          ) | Set-Content -LiteralPath $notesFile -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖上传资产。"
            gh release upload $tag $zipPath --clobber
          } else {
            $releaseArgs = @(
              'release', 'create', $tag, $zipPath,
              '--target', $env:RELEASE_SHA,
              '--title', "mybatis-plus-sql-visualizer $version",
              '--notes-file', $notesFile
            )
            # 内测通道（版本号带 -beta.N 等后缀）自动标记为预发布
            if ($version -match '-') { $releaseArgs += '--prerelease' }
            gh @releaseArgs
          }
