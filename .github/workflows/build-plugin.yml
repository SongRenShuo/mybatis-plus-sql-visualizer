name: 插件门禁与发行（手动）
run-name: 插件 CI（${{ inputs.mode }}）· ${{ inputs.branch || github.ref_name }}

# 四种运行模式（同一条流水线，按 mode 裁剪步骤）：
#   gate    全量分片测试 + buildPlugin/verifyPlugin + verifyGate(243/253/263) + verifyMarketplace，产物留 14 天，不发布
#   release 同上，跑完直接发布 GitHub Release
#   publish 只下载某次已成功门禁运行的插件产物并发布——不重建、不重跑门禁，发出去的字节就是门禁验过的那一份
#   tests   只跑全量分片测试
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'gate＝全量测试＋三目标门禁（默认，不发布）｜release＝门禁后直接发布｜publish＝复用已通过门禁的产物发布（不重跑门禁）｜tests＝只跑全量分片测试'
        required: false
        type: choice
        options:
          - gate
          - release
          - publish
          - tests
        default: gate
      run_id:
        description: 'publish 模式的门禁运行 id（留空＝该分支最近一次带插件产物的成功运行）'
        required: false
        type: string
      branch:
        description: '要运行/发行的分支（留空使用上方选择的分支）'
        required: false
        type: string
      notes:
        description: '完整发行说明路径（留空＝按版本号在 docs/发行说明 下匹配；仅在正文里作链接）'
        required: false
        type: string

# 创建 Release 并上传资产需要写权限（GITHUB_TOKEN）；
# actions: read 用于 publish 模式跨运行下载门禁产物（显式声明 permissions 会重置所有默认作用域）
permissions:
  contents: write
  actions: read

# 并发分组（2026-11-05 改）：gate 与 release/publish **分开两组**。
#
# 为什么拆：原先三种模式共用一组且 cancel-in-progress: false，对「手动偶尔跑」是对的，但一旦
# 接上 push 触发，高频推送会按 13~15 分钟/轮串行积压——第 N 次推送的结论要等 (N-1)×14 分钟，
# 中间那些轮次测的全是过时提交。而直接开 cancel-in-progress: true 又会让「新推送取消正在进行的
# 发行」，这是绝对不能发生的。
#
# 现在：
#   - gate（含未来 push 触发的空 mode）自成一组，新提交取消同组旧运行 → 队列永远只留最新提交，
#     延迟固定；
#   - release / publish 单独一组且永不取消（发行不能被中途打断，也不允许两次发行并发覆盖同一
#     Release 资产）；它们与 gate 组可并行，但两边都只有一个 build 会写 gradle 缓存，
#     偶发并发写失败只会退化成下游缓存未命中（慢），不会出错。
#
# 注意：push 事件没有 inputs，`inputs.mode` 为空串——上面两个表达式都按「非 release/publish
# 即 gate」写，空串会落到 gate 组且可取消，语义正确。
concurrency:
  group: >-
    plugin-ci-${{ (inputs.mode == 'release' || inputs.mode == 'publish') && 'release' || 'gate' }}-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: ${{ inputs.mode != 'release' && inputs.mode != 'publish' }}


jobs:
  build:
    # publish 模式只发布既有产物，不重建不重测
    # T-CiMatrix（2026-11-04）：原单 job 串行拆为 build / verify(matrix×3) / test(matrix×5)，
    # 三目标兼容验证与五片测试各自并行，墙钟从「串行相加」变成「取最长」。
    if: inputs.mode != 'publish'
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出目标分支
        uses: actions/checkout@v6
        with:
          # publish 模式检出的是门禁那次的提交（版本号/change notes/发行说明都取自同一棵树）
          ref: ${{ inputs.branch || github.ref_name }}
          persist-credentials: false

      - name: 安装 JDK 17
        if: inputs.mode != 'publish'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 CI 下载环境
        if: inputs.mode != 'publish'
        run: |
          # 仅修改 Runner 中的副本，移除本地代理并使用 Gradle 官方下载源。
          $propertiesPath = 'gradle.properties'
          $properties = Get-Content -LiteralPath $propertiesPath
          $properties | Where-Object { $_ -notmatch '^systemProp\.(http|https)\.proxy(Host|Port)=' } |
            Set-Content -LiteralPath $propertiesPath -Encoding utf8

          $wrapperPath = 'gradle/wrapper/gradle-wrapper.properties'
          $wrapper = Get-Content -LiteralPath $wrapperPath -Raw
          $wrapper.Replace('mirrors.cloud.tencent.com/gradle/', 'services.gradle.org/distributions/') |
            Set-Content -LiteralPath $wrapperPath -Encoding utf8 -NoNewline

      - name: 配置 Gradle 缓存
        if: inputs.mode != 'publish'
        # 缓存 Gradle User Home：verifyPlugin 下载的三版本 IDE 发行版与 verifier-cli 跨轮复用
        uses: gradle/actions/setup-gradle@v5

      # T-CiMarketSplit（2026-11-05）：build 不再准备测试 demo——它只打包，不跑测试。
      # demo 由 test 各片自己准备（Demo* 普查用例硬断言 demo 源码存在）。省 0.2 分钟且让下游提前起跑。

      - name: 打包插件
        if: inputs.mode == 'gate' || inputs.mode == 'release'
        # T-CiRelease（20261025）：各 gradle 步骤不再用 --no-daemon——单次 daemon JVM 在构建
        # 结束后须整进程退出，任何测试泄漏的非 daemon 线程都会把退出卡死（20261025 run
        # 40150222557 实证：五片 01:47 全部结束后静默 69 分钟直至取消）。常驻 daemon 下客户端
        # 在构建完成即返回，泄漏线程随 runner 回收；daemon 跨步骤复用顺带提速。
        # T-CiMarketSplit（2026-11-05）：`:verifyPlugin` 从这里挪到独立 job（见 verifyplugin）——
        # 它要 1.5 分钟且下游六条腿全在等它，挪走后 build 从 8.2 降到约 6.7，市场门禁提前起跑。
        # 走 run-gradle-retry 包装：这条腿一旦踩到 zip 文件系统竞态，整轮全灭。
        run: >-
          pwsh -NoProfile -File dev-support/ci/run-gradle-retry.ps1 -GradleArgs
          ":buildPlugin -PgifRecord=false --console=plain"

      # T-CiMatrix（2026-11-04）：verifyGate（三目标）与 testShards（五片）已拆到独立 matrix job 并行。
      # T-CiSplitMarketplace（2026-11-05）：verifyMarketplace 原在本 job 串行跑 4.8 分钟
      # （三目标逐个验证 2m41s/4m06s/4m17s，日志时间戳可对），而它是下游九个 job 全等的墙钟起点。
      # 拆出后 build 实测 13.3 → 7.3 分钟（run#9），marketplace 与 verify/test 三路并行。

      - name: 上传编译产物（供 verify / marketplace 复用，避免各自重编译）
        # T-CiTestDecouple（2026-11-05）：**test 分片不再下载本工件**——它们拿不到执行历史，
        # 下了也照样从头编译（run#10 test(4) 实测 compileKotlin 1m02），且为此白等整个 build。
        # T-CiMatrix（2026-11-04 run#1 实证）：必须 !cancelled() 而非默认的 success()——
        # 首跑时本步因前一步 verifyPlugin 失败而 skipped，导致九个下游 matrix job 全部
        # 「下载编译产物失败 → 分片/兼容门禁 skipped」，testShards 一片都没跑。
        # 产物在 buildPlugin 成功时就已生成，与 verifyPlugin 成败无关；让下游照常跑，
        # 才能看到「测试绿不绿」这个独立信息（本 job 仍会因 verifyPlugin 失败标红）。
        if: ${{ !cancelled() && inputs.mode != 'publish' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-outputs
          # 只传「后续 job 需要且重新生成昂贵」的目录：主 jar / 发行 zip / 编译产物 / 测试类 /
          # plugin.xml 补丁产物 / agent 子项目产物。缺失只会导致下游重新编译（慢），不会导致错误。
          # 【2026-11-05 run#8 撤回】曾把项目级 .gradle/ 也塞进工件，想让下游按执行历史判
          # UP-TO-DATE 跳过编译。实测 test(4) 因此编译期报 ClosedFileSystemException
          # （读 243 的 database-plugin.jar 时 zip FS 已被关闭）→ "Could not find bundled plugin
          # com.intellij.database"，一片红。收益（每片省约 2 分钟）与「发布门禁偶发红」的风险
          # 不对等，撤回；要再试必须先把 transform 缓存恢复口径（transforms-4 vs 9.7.0/transforms）
          # 与并发时序验干净。
          path: |
            build/libs/
            build/distributions/
            build/classes/
            build/resources/
            build/tmp/patchPluginXml/
            build/generated/
            sub-projects/sql-visualizer-agent/build/libs/
            sub-projects/sql-visualizer-agent/build/classes/
            sub-projects/sql-visualizer-agent/build/resources/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

      - name: 上传插件 ZIP
        if: inputs.mode == 'gate' || inputs.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ github.run_number }}
          path: build/distributions/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: 失败诊断输出（断言消息打到任务日志）
        # Gradle 精简控制台不显示断言消息（expected/actual、O147 子进程日志只在 test-results
        # XML 里），此步把所有失败用例的消息直接打进任务日志——无需下载工件即可定位。
        if: failure()
        run: |
          $files = Get-ChildItem -Path build/test-results, sub-projects/sql-visualizer-agent/build/test-results -Recurse -Filter 'TEST-*.xml' -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $content = Get-Content -LiteralPath $f.FullName -Raw -Encoding UTF8
            $failMatches = [regex]::Matches($content, '<(?:failure|error) message="([^"]*)"', 'Singleline')
            if ($failMatches.Count -gt 0) {
              Write-Host "===== $($f.Name) ====="
              foreach ($m in $failMatches) {
                Write-Host ([System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value))
                Write-Host '-----'
              }
            }
          }

      - name: 失败时上传测试报告（诊断通道）
        # 任务失败时把测试报告与结果 XML 打成工件——CI 控制台的精简格式不显示断言消息
        # （expected/actual、子进程日志都只在报告里），下载工件即可定位，终结盲猜轮次。
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            build/reports/tests/
            build/test-results/
            build/o147-diag/
            sub-projects/sql-visualizer-agent/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # T-CiMarketSplit（2026-11-05）：`:verifyPlugin` 从 build 里独立出来。它是 IPGP 原生兼容验证
  # （离线 + 豁免清单，报告口径），要 1.5 分钟，而下游六条腿全在等 build 结束。挪成并行 job 后
  # build 从 8.2 降到约 6.7 分钟，市场/兼容门禁都能提前起跑；覆盖面不缩水（gate 仍要求本 job 绿）。
  verifyplugin:
    needs: build
    if: ${{ !cancelled() && (inputs.mode == 'gate' || inputs.mode == 'release') }}
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出目标分支
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 CI 下载环境
        run: |
          $propertiesPath = 'gradle.properties'
          $properties = Get-Content -LiteralPath $propertiesPath
          $properties | Where-Object { $_ -notmatch '^systemProp\.(http|https)\.proxy(Host|Port)=' } |
            Set-Content -LiteralPath $propertiesPath -Encoding utf8

          $wrapperPath = 'gradle/wrapper/gradle-wrapper.properties'
          $wrapper = Get-Content -LiteralPath $wrapperPath -Raw
          $wrapper.Replace('mirrors.cloud.tencent.com/gradle/', 'services.gradle.org/distributions/') |
            Set-Content -LiteralPath $wrapperPath -Encoding utf8 -NoNewline

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: 下载编译产物
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: 官方兼容验证（verifyPlugin，离线 + 豁免清单）
        # -x buildPlugin：发行包来自 build 的工件（build/distributions 随 build-outputs 下发），
        # 本 job 不需要重新编译——不加这一项它会从头编一遍（run#14 实测该 job 8.7 分钟，
        # 其中约 2.4 分钟是编译），而编译产物与发行包本来就在工件里。本地已验证
        # `:verifyPlugin -x buildPlugin` 可跑通（BUILD SUCCESSFUL）。
        run: >-
          pwsh -NoProfile -File dev-support/ci/run-gradle-retry.ps1 -GradleArgs
          ":verifyPlugin -x buildPlugin -PgifRecord=false --console=plain"

  # T-CiSplitMarketplace（2026-11-05）：Marketplace 同口径在线门禁独立成 job（它只依赖打包产物）。
  # T-CiMarketSplit（2026-11-05 晚）：再拆成三条腿——原先三个 verifier JVM 挤在一台 2 核 runner 上
  # 互相争抢（run#11 实测同一份工作分别跑 162.9s / 249.3s / 256.7s），拆开后每条腿独占一台，
  # 判定口径不变（verifyMarketplaceVerdict<tag> 用的是同一个 checkMarketplaceVerdicts）。
  marketplace:
    needs: build
    if: ${{ !cancelled() && (inputs.mode == 'gate' || inputs.mode == 'release') }}
    strategy:
      fail-fast: false
      matrix:
        # T-CiMarketIdeProvision（2026-11-06）：ide = 该目标在 gradle transforms 里的解包目录名，
        # 供「确认验证目标 IDE 已解包」那步做存在性检查（名字错了就永远判定缺失、白跑一次 verifyPlugin）。
        include:
          - tag: '243'
            ide: ideaIU-2024.3.7.1-win
          - tag: '253'
            ide: idea-2025.3.5-win
          - tag: '263'
            ide: idea-2026.3-win
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出目标分支
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 CI 下载环境
        run: |
          $propertiesPath = 'gradle.properties'
          $properties = Get-Content -LiteralPath $propertiesPath
          $properties | Where-Object { $_ -notmatch '^systemProp\.(http|https)\.proxy(Host|Port)=' } |
            Set-Content -LiteralPath $propertiesPath -Encoding utf8

          $wrapperPath = 'gradle/wrapper/gradle-wrapper.properties'
          $wrapper = Get-Content -LiteralPath $wrapperPath -Raw
          $wrapper.Replace('mirrors.cloud.tencent.com/gradle/', 'services.gradle.org/distributions/') |
            Set-Content -LiteralPath $wrapperPath -Encoding utf8 -NoNewline

      - name: 配置 Gradle 缓存
        # 与 verify/test 同口径只读：写权限只留给 build job，避免多 job 并发写同一 key 全部失败
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: 下载编译产物
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: 播种 verifier-cli
        # T-CiMarketSplit（2026-11-05）：不再依赖 build 跑过 :verifyPlugin 导出 jar——直接按
        # dev-support/verifier-cli-version.txt 钉住的版本从 Maven Central 取（约 30MB，几秒）。
        # 版本漂移由 VerifierCliVersionGuardTest 在本机全量测试里兜（IPGP 升级后钉子不一致即红）。
        run: |
          $v = (Get-Content -LiteralPath 'dev-support/verifier-cli-version.txt' -Raw).Trim()
          if (-not $v) { throw 'dev-support/verifier-cli-version.txt 为空' }
          $dst = Join-Path $env:GRADLE_USER_HOME 'caches/modules-2/files-2.1/org.jetbrains.intellij.plugins/verifier-cli/ci-seed'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $jar = Join-Path $dst "verifier-cli-$v-all.jar"
          $url = "https://repo1.maven.org/maven2/org/jetbrains/intellij/plugins/verifier-cli/$v/verifier-cli-$v-all.jar"
          Invoke-WebRequest -Uri $url -OutFile $jar -UseBasicParsing
          Write-Host "verifier-cli 已播种：$jar（$v）"

      - name: 确认验证目标 IDE 已解包（缺则先跑一次该目标的 verifyPlugin）
        # T-CiMarketIdeProvision（2026-11-06 首跑实证）：verifyMarketplace<tag> 的 ideDir() 是**硬校验**
        # ——它只在 gradle 缓存的 transforms/*/transformed/<IDE 目录名> 里找发行版，找不到直接报
        # 「IDE 发行目录 … 未在 gradle 缓存 transforms 找到」。手工门禁里 243/253 之所以一直能过，
        # 是因为历史上 build job 内联跑过 verifyPlugin、把它们解包进了可写缓存；263 是后加的目标，
        # 从没被解包过 → nightly 首跑 marketplace(263) 70 秒就红。
        # 这里显式兜住：该目标的 IDE 不在 transforms 里时，先跑一次 `:verifyPlugin -PverifyIdes=<tag>`
        # （约 4 分钟，只在那条腿付），把解包产物做出来，再跑 marketplace。
        run: |
          $ideName = '${{ matrix.ide }}'
          $found = $false
          foreach ($c in Get-ChildItem -Path (Join-Path $env:GRADLE_USER_HOME 'caches') -Directory -ErrorAction SilentlyContinue) {
            $t = Join-Path $c.FullName 'transforms'
            if (-not (Test-Path -LiteralPath $t)) { continue }
            foreach ($h in Get-ChildItem -Path $t -Directory -ErrorAction SilentlyContinue) {
              if (Test-Path -LiteralPath (Join-Path $h.FullName "transformed\$ideName")) { $found = $true; break }
            }
            if ($found) { break }
          }
          if ($found) {
            Write-Host "验证目标 IDE 已解包：$ideName（跳过 provisioning）"
          } else {
            Write-Host "::notice::验证目标 IDE 未解包：$ideName → 先跑该目标的 verifyPlugin 填充 transforms"
            pwsh -NoProfile -File dev-support/ci/run-gradle-retry.ps1 -GradleArgs `
              ":verifyPlugin -PverifyIdes=${{ matrix.tag }} -x buildPlugin -PgifRecord=false --console=plain"
            if ($LASTEXITCODE -ne 0) { throw "provisioning 失败（verifyPlugin ${{ matrix.tag }}）" }
          }
      - name: Marketplace 门禁 ${{ matrix.tag }}（在线 + 无豁免 + 逐份 verdict 判定）
        # 发行包取自 build 的工件（不再重打包：重打包会让「已验证的字节」与「最终上传的字节」不是同一份）。
        # 判定由 verifyMarketplaceVerdict<tag> 在 doLast 里做，与聚合任务同一个 checkMarketplaceVerdicts。
        run: >-
          pwsh -NoProfile -File dev-support/ci/run-gradle-retry.ps1 -GradleArgs
          ":verifyMarketplaceVerdict${{ matrix.tag }} -PgifRecord=false --console=plain"

  # T-CiMatrix（2026-11-04）：三目标兼容验证并行——每个 job 只验一个 IDE 版本
  # （-PverifyIdes=243/253/263 单版本模式，buildSrc 的 pluginVerification.ides 与 verifyGate
  # targets 两处都已支持）。原串行 2m43s 的三段现在同起，墙钟 ≈ 单目标 1m27s + 缓存/下载开销。
  verify:
    needs: build
    if: ${{ !cancelled() && (inputs.mode == 'gate' || inputs.mode == 'release') }}
    strategy:
      fail-fast: false
      matrix:
        ide: ['243', '253', '263']
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出目标分支
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 CI 下载环境
        run: |
          $propertiesPath = 'gradle.properties'
          $properties = Get-Content -LiteralPath $propertiesPath
          $properties | Where-Object { $_ -notmatch '^systemProp\.(http|https)\.proxy(Host|Port)=' } |
            Set-Content -LiteralPath $propertiesPath -Encoding utf8

          $wrapperPath = 'gradle/wrapper/gradle-wrapper.properties'
          $wrapper = Get-Content -LiteralPath $wrapperPath -Raw
          $wrapper.Replace('mirrors.cloud.tencent.com/gradle/', 'services.gradle.org/distributions/') |
            Set-Content -LiteralPath $wrapperPath -Encoding utf8 -NoNewline

      - name: 配置 Gradle 缓存
        # T-CiMatrix（2026-11-05 run#3/#4 实证）：matrix 下的 verify/test 一律**只读**。
        # 九个 job 并发写同一个 cache key 时只有第一个能成功，其余日志里是
        # "Failed to save cache entry"，于是 IDE distro（约 700MB/目标）与 verifier-cli
        # 每轮重下——verify 单 job 8~13 分钟的主因就在这。写权限只留给 build job
        # （它跑全量 :verifyPlugin，会把三个目标一并下载进缓存）。
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: 下载编译产物
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: 播种 verifier-cli
        # T-CiMarketSplit（2026-11-05）：替代原先「跑一次 :verifyPlugin 预热」——预热会连带重新编译
        # 整个项目（约 4 分钟），而这里只缺一个 jar。改为按 dev-support/verifier-cli-version.txt
        # 钉住的版本从 Maven Central 直取；版本漂移由 VerifierCliVersionGuardTest 兜底。
        run: |
          $v = (Get-Content -LiteralPath 'dev-support/verifier-cli-version.txt' -Raw).Trim()
          if (-not $v) { throw 'dev-support/verifier-cli-version.txt 为空' }
          $dst = Join-Path $env:GRADLE_USER_HOME 'caches/modules-2/files-2.1/org.jetbrains.intellij.plugins/verifier-cli/ci-seed'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $jar = Join-Path $dst "verifier-cli-$v-all.jar"
          $url = "https://repo1.maven.org/maven2/org/jetbrains/intellij/plugins/verifier-cli/$v/verifier-cli-$v-all.jar"
          Invoke-WebRequest -Uri $url -OutFile $jar -UseBasicParsing
          Write-Host "verifier-cli 已播种：$jar（$v）"

      - name: 兼容门禁 ${{ matrix.ide }}
        # -PverifyOnly=true 复用 build job 产出的发行包；-PverifyIdes 单版本；
        # -PgateStaggerMs=0 关掉「等 marketplace 高占用段」的 285s 错峰延迟（并行 job 各自独立 runner，无需错峰）。
        # 走 run-gradle-retry 包装：同一处 zip 文件系统竞态也会打在这条腿的配置期。
        run: >-
          pwsh -NoProfile -File dev-support/ci/run-gradle-retry.ps1 -GradleArgs
          ":verifyGate -PverifyOnly=true -PverifyIdes=${{ matrix.ide }} -PgateStaggerMs=0 -PgifRecord=false --console=plain"

  # T-CiMatrix（2026-11-04）：五片测试并行——每个 job 只跑一片。
  # T-JUnit5Eval 方案 2（2026-11-05）：matrix 加第 6 个取值 `fast`——分片只装平台类，零 com.intellij
  # 引用的纯逻辑类（374 类 / 4393 例）由该 job 跑 :testFast；命令按取值分派，见下方 step。
  # T-CiTestDecouple（2026-11-05）：分片**不再等 build**。依据：testShardN 的依赖只有
  # verifyDemoFixture + testShardStagger（mpv-testing.gradle.kts:972-975），没有 buildPlugin；
  # 测试源码里也没有任何一处读 build/distributions。而 run#10 的 test(4) 明明下载了编译产物，
  # 仍从头编译（compileKotlin 1m02 + jar/prepareSandbox 30s + compileTestKotlin 28s）——
  # 产物对分片是白传的，还让五片白等整个 build（约 8 分钟）。去掉 needs 后五片与 build 同起。
  # testFast 同理由（非沙盒 JVM，classpath 复用默认 test 成品），同样不等 build。
  test:
    if: ${{ !cancelled() && inputs.mode != 'publish' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4', '5', 'fast']
    runs-on: windows-latest
    timeout-minutes: 40

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出目标分支
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 CI 下载环境
        run: |
          $propertiesPath = 'gradle.properties'
          $properties = Get-Content -LiteralPath $propertiesPath
          $properties | Where-Object { $_ -notmatch '^systemProp\.(http|https)\.proxy(Host|Port)=' } |
            Set-Content -LiteralPath $propertiesPath -Encoding utf8

          $wrapperPath = 'gradle/wrapper/gradle-wrapper.properties'
          $wrapper = Get-Content -LiteralPath $wrapperPath -Raw
          $wrapper.Replace('mirrors.cloud.tencent.com/gradle/', 'services.gradle.org/distributions/') |
            Set-Content -LiteralPath $wrapperPath -Encoding utf8 -NoNewline

      - name: 配置 Gradle 缓存
        # T-CiMatrix（2026-11-05 run#3/#4 实证）：matrix 下的 verify/test 一律**只读**。
        # 九个 job 并发写同一个 cache key 时只有第一个能成功，其余日志里是
        # "Failed to save cache entry"，于是 IDE distro（约 700MB/目标）与 verifier-cli
        # 每轮重下——verify 单 job 8~13 分钟的主因就在这。写权限只留给 build job
        # （它跑全量 :verifyPlugin，会把三个目标一并下载进缓存）。
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: 准备测试 demo
        # testShards 的 Demo* 普查用例硬断言 demo 源码存在（clone 到仓库兄弟目录的固定位置）
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File dev-support/test-demo/setup-test-env.ps1 -SkipDb

      - name: 测试腿 ${{ matrix.shard }}
        # 三类真机依赖用例在 CI 剔除（本地发版前照跑）：AttachPoolWarmGateTest / DataSourceJdbcSmokeTest /
        # O147RealAgentAcceptanceTest——它们需要本机 MySQL 或本机 JDK8。
        # T-JUnit5Eval 方案 2：matrix 取值分派——`fast` 走 :testFast（纯逻辑快桶腿，非沙盒 JVM），
        # 其余走 :testShardN。两个 -P 排除口对 testFast 的语义不同：-PagentTestExclude 属 agent 子项目
        # （快桶腿不跑子项目，无需传）；-PtestShardExcludeClasses **要传**——testFast 与分片同源尊重
        # 该清单（O147RealAgentAcceptanceTest 属纯逻辑类，不传就会在没有本机 JDK8/agent 池的 runner 上红）。
        timeout-minutes: 30
        # T-CiZipFsFlake（2026-11-05）：Gradle 配置期解析 243 的 database-plugin.jar 时偶发
        # ClosedFileSystemException（约 4/25 片）。原地重跑无效——Gradle daemon 跨调用复用，
        # 关闭状态留在 daemon 里，所以包装脚本会先 `--stop` 再重跑一次（详见脚本头注释）。
        env:
          LEG: ${{ matrix.shard }}
        run: |
          $common = @('-PgifRecord=false', '--console=plain')
          if ($env:LEG -eq 'fast') {
            $gradleArgs = (@(':testFast') + $common + @(
              '-PtestShardExcludeClasses=cn.song.mybatisplus.visualizer.execute.DataSourceJdbcSmokeTest,cn.song.mybatisplus.visualizer.log.O147RealAgentAcceptanceTest'
            )) -join ' '
          } else {
            $gradleArgs = (@(":testShard$($env:LEG)") + $common + @(
              '-PtestShardExcludeClasses=cn.song.mybatisplus.visualizer.execute.DataSourceJdbcSmokeTest,cn.song.mybatisplus.visualizer.log.O147RealAgentAcceptanceTest',
              '-PagentTestExclude=cn.song.mybatisplus.sqlvis.agent.AttachPoolWarmGateTest'
            )) -join ' '
          }
          Write-Host "gradle args: $gradleArgs"
          pwsh -NoProfile -File dev-support/ci/run-gradle-retry.ps1 -GradleArgs $gradleArgs
          exit $LASTEXITCODE

      - name: 失败诊断输出（断言消息打到任务日志）
        if: failure()
        run: |
          $files = Get-ChildItem -Path build/test-results, sub-projects/sql-visualizer-agent/build/test-results -Recurse -Filter 'TEST-*.xml' -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $content = Get-Content -LiteralPath $f.FullName -Raw -Encoding UTF8
            $failMatches = [regex]::Matches($content, '<(?:failure|error) message="([^"]*)"', 'Singleline')
            if ($failMatches.Count -gt 0) {
              Write-Host "===== $($f.Name) ====="
              foreach ($m in $failMatches) {
                Write-Host ([System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value))
                Write-Host '-----'
              }
            }
          }

      - name: 失败时上传测试报告（诊断通道）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-shard${{ matrix.shard }}-${{ github.run_number }}
          path: |
            build/reports/tests/
            build/test-results/
            sub-projects/sql-visualizer-agent/build/test-results/
          if-no-files-found: ignore

  # T-CiGateAggregate（2026-11-05，取自 t8y2/dbx 的 ci-gate 思路）：聚合门禁。
  # 背景：GitHub 里 skipped 的 job 不会让整轮运行变红——而 verify / marketplace / test 都带
  # if: !cancelled()，一旦某条 leg 因条件求值意外为假、matrix 写错、或 needs 链断掉而被 skip，
  # 运行结论照样可能是绿的，等于「没验也过」。dbx 用 ci-gate.mjs 逐 job 校验「该跑的必须成功、
  # 不该跑的才允许 skipped」（其 .github/scripts/ci-gate.mjs:4-66）。
  # 这里把同一语义落在 needs 上：五条腿必须全部 success，skipped 也判红并点名是哪条。
  gate:
    needs: [build, verifyplugin, marketplace, verify, test]
    if: ${{ !cancelled() && (inputs.mode == 'gate' || inputs.mode == 'release') }}
    runs-on: windows-latest
    timeout-minutes: 5

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 校验五条腿的真实结论
        env:
          R_BUILD: ${{ needs.build.result }}
          R_VERIFYPLUGIN: ${{ needs.verifyplugin.result }}
          R_MARKETPLACE: ${{ needs.marketplace.result }}
          R_VERIFY: ${{ needs.verify.result }}
          R_TEST: ${{ needs.test.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          $legs = [ordered]@{
            'build'        = $env:R_BUILD
            'verifyplugin' = $env:R_VERIFYPLUGIN
            'marketplace'  = $env:R_MARKETPLACE
            'verify'       = $env:R_VERIFY
            'test'         = $env:R_TEST
          }
          $bad = @()
          foreach ($k in $legs.Keys) {
            $v = $legs[$k]
            Write-Host ("{0,-12} = {1}" -f $k, $v)
            # success 之外一律判红：skipped 意味着这条门禁没跑（不是「不需要跑」）
            if ($v -ne 'success') { $bad += "$k=$v" }
          }
          if ($bad.Count -gt 0) {
            throw ("门禁未全部通过：" + ($bad -join '、') + "。skipped 视同未验证，不得当作通过。")
          }
          Write-Host '五条腿全部 success：build / verifyplugin / marketplace×3 / verify×3 / test×6（5 片 + 快桶腿）'

  publish:
    # 门禁通过后才进入本 job；挂 environment 后这里会停下来等人工批准
    # （仓库 Settings → Environments → release 配 required reviewers；未配审批人则直接发布）
    # T-CiMatrix：门禁已拆为 build / verify / test / marketplace 四个 job，release 模式由聚合门禁
    # （gate）统一判定四腿全 success；publish 模式只依赖 build（它只下载既有产物，不看门禁结果）。
    needs: [build, verify, test, marketplace, gate]
    # !cancelled() 而不是 always()：取消运行时不能把发布 job 拉起来
    if: ${{ !cancelled() && (inputs.mode == 'publish' || (inputs.mode == 'release' && needs.gate.result == 'success')) }}
    environment: release
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 解析发布源（publish 模式）
        # 复用此前通过门禁的运行：只取「检出提交 + 已上传的插件 zip」，不重建、不重跑门禁，
        # 保证发出去的字节就是门禁验证过的那一份。未给 run_id 时取该分支最近一次带产物的成功运行。
        if: inputs.mode == 'publish'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID_INPUT: ${{ inputs.run_id }}
          BRANCH_INPUT: ${{ inputs.branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $branch = if ($env:BRANCH_INPUT) { $env:BRANCH_INPUT } else { $env:GITHUB_REF_NAME }
          $runId = $env:RUN_ID_INPUT
          if (-not $runId) {
            # 该分支最近 20 次成功运行里，取第一个确实带 plugin-<run_number> 产物的
            # （tests 模式不产出该产物，不能只看「成功」）
            $resp = gh api "repos/$repo/actions/runs?branch=$([uri]::EscapeDataString($branch))&status=success&per_page=20" |
              ConvertFrom-Json
            foreach ($c in $resp.workflow_runs) {
              $names = @(gh api "repos/$repo/actions/runs/$($c.id)/artifacts" --jq '.artifacts[].name')
              if ($names -contains "plugin-$($c.run_number)") { $runId = $c.id; break }
            }
            if (-not $runId) {
              throw "分支 $branch 上找不到带插件产物的成功运行；请显式传 run_id（该运行 URL 末尾的 /runs/<id>）"
            }
          }
          $run = gh api "repos/$repo/actions/runs/$runId" | ConvertFrom-Json
          if ($run.conclusion -ne 'success') { throw "运行 $runId 的结论是 $($run.conclusion)，只能基于成功的门禁运行发布" }
          if ($run.head_branch -ne $branch) {
            Write-Host "提示：运行 $runId 来自分支 $($run.head_branch)（输入分支是 $branch），按运行自身分支发布"
          }
          $artName = "plugin-$($run.run_number)"
          $have = @(gh api "repos/$repo/actions/runs/$runId/artifacts" --jq '.artifacts[].name')
          if (-not ($have -contains $artName)) {
            throw "运行 $runId 里没有产物 $artName（tests 模式不产出该产物，或已过 14 天保留期）"
          }
          Write-Host "发布源运行=$runId 分支=$($run.head_branch) 提交=$($run.head_sha) 产物=$artName"
          "sha=$($run.head_sha)"            | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "branch=$($run.head_branch)"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run_id=$runId"                   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run_number=$($run.run_number)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 检出目标分支
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha || inputs.branch || github.ref_name }}
          persist-credentials: false

      - name: 下载门禁产物（publish 模式）
        if: inputs.mode == 'publish'
        uses: actions/download-artifact@v8
        with:
          name: plugin-${{ steps.source.outputs.run_number }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: build/distributions

      - name: 下载本次构建产物（release 模式）
        if: inputs.mode == 'release'
        uses: actions/download-artifact@v8
        with:
          name: plugin-${{ github.run_number }}
          path: build/distributions

      - name: 发布到 GitHub Release（本版变更 + 完整发行说明链接）
        if: inputs.mode == 'release' || inputs.mode == 'publish'
        # 正文结构＝本版变更清单（取 gradle/plugin-change-notes.html 里 v{version} 那一段，与 IDE 详情页
        # 「最新变化」同源）+ 全部历史版本（<details> 折叠，就地展开，不外链 HTML 源文件）+ 发行元信息
        # （附件/标签/完整发行说明/全部发行版本/构建记录）+ 反馈入口（官网需求池与微信/交流群二维码）。
        # 不整份贴的只有发行说明 md（约 20 KB 且带「测试」一节内部读数），它作为链接目标；首屏仍是
        # 本版二十来条用户可见变更，全量清单点开即见。
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.source.outputs.branch || inputs.branch || github.ref_name }}
          RELEASE_NOTES_INPUT: ${{ inputs.notes }}
          RELEASE_SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ((Get-Content 'gradle.properties' | Where-Object { $_ -match '^version=' } | Select-Object -First 1) -replace '^version=', '').Trim()
          if (-not $version) { throw '未能从 gradle.properties 解析出 version=' }
          $tag = $version
          $title = "🎉 SQL Visualizer v$version"

          # 发行标签必须落在**实际检出并打包**的提交上：dispatch 的 ref 与输入 branch 可以不同
          # （--ref master -f branch=dev 时 github.sha 是 master 的），故取检出树的 HEAD 而非 github.sha
          $headSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $headSha) { throw 'git rev-parse HEAD 失败' }

          # 内测版（-beta.N）先按完整版本号找，找不到退回基号——change notes 与发行说明都按此约定
          $probes = @($tag)
          if ($tag -match '^([^-]+)-') { $probes += $Matches[1] }

          # ---- 1. 本版变更清单：切 gradle/plugin-change-notes.html ----
          $cnPath = 'gradle/plugin-change-notes.html'
          if (-not (Test-Path -LiteralPath $cnPath)) { throw "change notes 不存在：$cnPath" }
          $cn = Get-Content -LiteralPath $cnPath -Raw -Encoding utf8
          $segment = $null
          $currentBlock = $null
          foreach ($probe in $probes) {
            $m = [regex]::Match($cn, "(?s)<h2>\s*v?$([regex]::Escape($probe))\s*</h2>(.*?)(?=<h2>|\z)")
            if ($m.Success) { $segment = $m.Groups[1].Value.Trim(); $currentBlock = $m.Value; break }
          }
          if (-not $segment) {
            $have = ([regex]::Matches($cn, '<h2>(.*?)</h2>') | ForEach-Object { $_.Groups[1].Value }) -join '、'
            throw "$cnPath 里没有 v$version 的标题块，无法拼发行正文（现存：$have）"
          }
          $bullets = [regex]::Matches($segment, '(?s)<li>(.*?)</li>')
          if ($bullets.Count -eq 0) { throw "$cnPath 的 v$version 段里没有 <li> 变更条目" }
          # 统一换行，避免文件里的 CRLF 与 Markdown 的 LF 混排
          $segment = $segment -replace "`r`n", "`n"
          # 历史版本＝去掉本版那段后的全部内容，供正文里折叠展开
          $history = ($cn.Replace($currentBlock, '').Trim()) -replace "`r`n", "`n"
          $historyVersions = [regex]::Matches($history, '<h2>').Count
          $historyBullets = [regex]::Matches($history, '<li>').Count

          # ---- 2. 完整发行说明：只作链接目标，不贴正文 ----
          $notesDir = 'docs/发行说明'
          $notesFile = $env:RELEASE_NOTES_INPUT
          if ($notesFile) {
            if (-not (Test-Path -LiteralPath $notesFile)) { throw "指定的发行说明不存在：$notesFile" }
            $notesFile = (Resolve-Path -LiteralPath $notesFile).Path
          } else {
            if (-not (Test-Path -LiteralPath $notesDir)) { throw "发行说明目录不存在：$notesDir" }
            foreach ($probe in $probes) {
              # 版本号两侧加边界，避免 v2026.10.2 误命中 v2026.10.23
              $pattern = "(?<![0-9A-Za-z._-])v$([regex]::Escape($probe))(?![0-9A-Za-z._-])"
              $hit = Get-ChildItem -LiteralPath $notesDir -Filter '*-发行说明.md' |
                Where-Object { (Get-Content -LiteralPath $_.FullName -Raw -Encoding utf8) -match $pattern } |
                Sort-Object Name -Descending | Select-Object -First 1
              if ($hit) { $notesFile = $hit.FullName; break }
            }
            if (-not $notesFile) {
              $available = (Get-ChildItem -LiteralPath $notesDir -Filter '*-发行说明.md' | Sort-Object Name -Descending |
                Select-Object -First 5 -ExpandProperty Name) -join '、'
              throw "在 $notesDir 下找不到正文含 v$version 的发行说明，请用工作流输入 notes 显式指定。最近 5 份：$available"
            }
          }
          # 链接钉 tag 而不是分支：分支前进或改名都不会失效；中文路径逐段做 URL 编码
          $notesName = [System.IO.Path]::GetFileName($notesFile)
          $encodedPath = ((("docs/发行说明/$notesName") -split '/') | ForEach-Object { [System.Uri]::EscapeDataString($_) }) -join '/'
          $notesUrl = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/blob/$tag/$encodedPath"

          # ---- 3. 组装正文 ----
          $zipName = "mybatis-plus-sql-visualizer-$version.zip"
          $runUrl = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
          $repoBase = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)"
          $giteeUrl = "https://gitee.com/songrenshuo/mybatis-plus-sql-visualizer/releases/tag/$tag"
          $releasesUrl = "$repoBase/releases"
          $readmeUrl = "$repoBase/blob/$tag/README.md"
          $feedbackUrl = 'https://sql-visualizer.jvtools.cn/about/feedback'
          $bodyLines = @(
            '## 本版变更',
            '',
            $segment
          )
          # 全部历史版本就地折叠展开——change notes 是 HTML 文件，GitHub 只会把它当源码显示，
          # 外链过去是一屏 <h2>/<li> 标签墙，所以要展开就直接把内容放进正文
          if ($historyVersions -gt 0) {
            $bodyLines += @(
              '',
              '<details>',
              ('<summary>查看全部历史变更（{0} 个版本 · {1} 条，v{2} 之前的部分）</summary>' -f $historyVersions, $historyBullets, $tag),
              '',
              $history,
              '',
              '</details>'
            )
          }
          $bodyLines += @(
            '',
            '---',
            '',
            ('- 附件：`{0}`' -f $zipName),
            ('- 标签：`{0}`（提交 `{1}`，分支 {2}）' -f $tag, $headSha.Substring(0, 7), $env:RELEASE_BRANCH),
            ('- 完整发行说明：[{0}]({1})' -f $notesName, $notesUrl),
            ('- 全部发行版本：[Releases]({0})' -f $releasesUrl),
            ('- Gitee 同版发行版（自更新通道）：{0}' -f $giteeUrl),
            # publish 模式是另一次运行，产物与门禁结论来自源运行，两个链接都给出才追得回
            $(if ($env:RELEASE_SOURCE_RUN) {
                ('- 构建记录：{0}（门禁运行：{1}）' -f $runUrl, "$repoBase/actions/runs/$($env:RELEASE_SOURCE_RUN)")
              } else {
                ('- 构建记录：{0}' -f $runUrl)
              }),
            '',
            '---',
            '',
            ('**反馈**：遇到问题或有建议，欢迎到 [官网需求池]({0}) 提交；也可以扫码加作者微信 / 交流群。' -f $feedbackUrl),
            '',
            '| 作者微信 | 交流群 |',
            '|---|---|',
            '| ![作者微信](https://sql-visualizer.jvtools.cn/wechat-qr.png) | ![交流群](https://sql-visualizer.jvtools.cn/group-qr.jpg) |',
            '',
            ('二维码失效时，可从 [官网](https://sql-visualizer.jvtools.cn) 或 [README.md]({0}) 底部查看最新入口。' -f $readmeUrl)
          )
          $bodyText = $bodyLines -join "`n"
          $bodyFile = Join-Path ($(if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP })) 'github-release-body.md'
          Set-Content -LiteralPath $bodyFile -Value $bodyText -Encoding utf8NoBOM

          $zipPath = "build/distributions/$zipName"
          if (-not (Test-Path -LiteralPath $zipPath)) { throw "发行包不存在：$zipPath" }
          Write-Host "版本=$version 标签=$tag 分支=$env:RELEASE_BRANCH 提交=$headSha"
          Write-Host "本版变更条目=$($bullets.Count) 完整发行说明=$notesFile"

          # ---- 4. 建版 / 覆盖 ----
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在：覆盖资产并同步标题与正文。"
            gh release upload $tag $zipPath --clobber
            if ($LASTEXITCODE -ne 0) { throw 'gh release upload 失败' }
            $editArgs = @('release', 'edit', $tag, '--title', $title, '--notes-file', $bodyFile)
            if ($version -match '-') { $editArgs += '--prerelease' }
            gh @editArgs
            if ($LASTEXITCODE -ne 0) { throw 'gh release edit 失败' }
          } else {
            $releaseArgs = @(
              'release', 'create', $tag, $zipPath,
              '--target', $headSha,
              '--title', $title,
              '--notes-file', $bodyFile
            )
            # 内测通道（版本号带 -beta.N 等后缀）自动标记为预发布
            if ($version -match '-') { $releaseArgs += '--prerelease' }
            gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { throw 'gh release create 失败' }
          }

          # ---- 5. 回读校验：正文必须带本版首条与末条变更（切片没切偏、没被覆盖成旧正文）----
          $plain = @($bullets | ForEach-Object { (($_.Groups[1].Value -replace '<[^>]+>', '').Trim()) })
          foreach ($n in @($plain[0], $plain[-1])) {
            $needle = if ($n.Length -gt 24) { $n.Substring(0, 24) } else { $n }
            $body = (gh release view $tag --json body --jq '.body') -join "`n"
            if ($LASTEXITCODE -ne 0) { throw 'gh release view 回读失败' }
            if (-not $body.Contains($needle)) {
              throw "回读校验失败：Release 正文缺少本版变更条目「$needle…」"
            }
          }
          Write-Host "回读校验通过：本版首末条变更均在正文中"

          "GitHub Release ``$tag``：分支 $env:RELEASE_BRANCH @ $headSha，正文＝本版 change notes（$($bullets.Count) 条）+ 历史折叠（$historyVersions 版 / $historyBullets 条）+ 元信息与反馈，完整说明 $notesUrl" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
